<svg width="100%" viewBox="0 0 680 382" role="img">
<title>How far back a terminal-frame reward reaches, under two priors</title>
<desc>Line chart of the fractional variance reduction per frame caused by a quadratic reward on the last of sixteen frames. Under the ring-anchored random walk the reduction is large everywhere, rising roughly linearly from 0.22 at the first frame to 0.82 at the last. Under the stationary autoregressive prior it is confined to the final frames, falling by a factor alpha squared per frame going backwards, from 0.71 at the last frame to 0.0009 at the first, a 251-fold difference at the first frame.</desc>
