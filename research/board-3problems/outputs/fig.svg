<svg width="100%" viewBox="0 0 680 338" role="img">
<title>Joint versus marginal score on the rotating ring model</title>
<desc>Four planar panels. Panel a shows four data trajectories spiralling coherently around the unit circle. Panel b shows the same trajectories after the orthogonal gauge, now plain random walks starting on the circle. Panel c, generated by the reverse diffusion driven by the exact joint score, reproduces the coherent rotation with turning concentration 0.94. Panel d, driven by per-frame marginal scores, has correct radii but turning concentration 0.01, that is no rotation at all.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="26">Same data, two score objects (T = 12 frames, D = 24)</text>
<text class="ts" x="40" y="44">R = concentration of the per-step turning angle; the true rotation is psi = 30 degrees</text>
